    <script>
      // 抓網址
      // console.log(window.location.href);
      // 抓 hash
      // console.log(window.location.hash);
      // 抓 hash，去 # 字號
      // console.log(window.location.hash.slice(1));
      const cards = document.querySelectorAll("main .card");

      const imgAry = [
        "https://images.pexels.com/photos/33397171/pexels-photo-33397171.jpeg",
        "https://images.pexels.com/photos/20212347/pexels-photo-20212347.jpeg",
        "https://images.pexels.com/photos/6204267/pexels-photo-6204267.jpeg",
        "https://images.pexels.com/photos/38094623/pexels-photo-38094623.jpeg"
      ];

      imgAry.forEach(function(url, i){
        const node = document.createElement("img");
        node.src = url;
        node.className = "w-100 h-100 object-fit-cover";
        cards[i].innerHTML = "";
        cards[i].append(node);
        cards[i].classList.add("overflow-hidden", "grad1");
      });

      handleHashChange();

      window.addEventListener("hashchange", handleHashChange);
      
      function handleHashChange(){
        // 傳統寫法
        // let tag = window.location.hash;
        // console.log(tag == "");
        // if(tag == ""){
        //   tag = "#item1"
        // }
        
        // 看起來比較厲害的寫法
        // 短路賦值
        let tag = window.location.hash || "#item1";

        // ? 保護語法
        document.querySelector(".active")?.classList.remove("active");
        document.querySelector(`a[href="${tag}"]`)?.classList.add("active");
      }
